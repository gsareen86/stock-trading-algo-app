[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-platform-backend"
version = "0.1.0"
description = "Agentic swing + long-term equity platform — backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=17",       # parquet price cache
    "yfinance>=0.2.40",
    "requests>=2.31",    # NSE constituent CSV
    "feedparser>=6.0",   # RSS news skill
    "jsonschema>=4.20",  # skill input/output contracts
]

[project.optional-dependencies]
# LiteLLM and Langfuse are imported lazily by app/llm/. The gateway degrades to an
# unconfigured state when they are absent, so the app and its tests run without them.
llm = [
    "litellm>=1.55",
    "langfuse>=2.53",
]
# The agent graph and the MCP client. Imported lazily by app/agents/, so the API, the
# strategies and their tests all run without them.
agents = [
    "langgraph>=1.0",
    "mcp>=2.0",
]
postgres = [
    "psycopg[binary]>=3.2",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
